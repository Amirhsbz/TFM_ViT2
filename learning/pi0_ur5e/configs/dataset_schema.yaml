action_mode: joint_position_gripper
image_size: [224, 224]
camera_padding_strategy: duplicate_base
include_tactile: false
# tactile_feature_mode: none | low_dim | image_embedding | raw_image
#   raw_image keeps observation.state at 7-D and instead writes raw tactile
#   frames as observation.images.tactile_left_rgb / tactile_right_rgb.
tactile_feature_mode: none
tactile_embedding_dim: 128
default_prompt: pick up the paper cup and place it on the target

# Override these lists if a dataset uses different names. Dotted names are
# supported for nested dict/JSONL rows.
field_map:
  base_rgb:
    - base_rgb
    - base_camera_rgb_1
    - third_view_camera_rgb
    - base_camera_rgb
    - observation.images.base_rgb
  wrist_rgb:
    - wrist_rgb
    - base_camera_rgb_0
    - wrist_camera_rgb
    - camera_wrist_rgb
    - observation.images.wrist_rgb
  robot_state:
    - robot_state
    - joint_positions
    - ee_pos_quat
    - observation.state
  ee_pose:
    - ee_pos_quat
    - eef_pose
    - ee_pose
    - tcp_pose
  action:
    - action
    - control
    - actions
  gripper_state:
    - gripper_state
    - gripper_position
  tactile:
    - tactile
    - touch
    - force
    - pressure
  tactile_left_rgb:
    - tactile_left_rgb
    - left_tactile_rgb
    - observation.images.tactile_left_rgb
  tactile_right_rgb:
    - tactile_right_rgb
    - right_tactile_rgb
    - observation.images.tactile_right_rgb
  language_instruction:
    - language_instruction
    - prompt
    - task
